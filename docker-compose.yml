services:
  postgres:
    image: postgres:18-alpine
    container_name: pass-in-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pass_in}
      POSTGRES_USER: ${POSTGRES_USER:-pass_in}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass_in}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data-v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: pass-in-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pass_in}
      DATABASE_USERNAME: ${POSTGRES_USER:-pass_in}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-pass_in}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:9090,http://127.0.0.1:9090}
      CHECK_IN_TOKEN_SECRET: ${CHECK_IN_TOKEN_SECRET:-pass-in-dev-secret}
      CHECK_IN_TOKEN_TTL: ${CHECK_IN_TOKEN_TTL:-PT24H}
      JWT_SECRET: ${JWT_SECRET:-pass-in-auth-dev-secret}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-PT15M}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-P7D}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: pass-in-frontend
    ports:
      - "9090:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data-v18:
