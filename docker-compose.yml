services:
  postgres:
    image: postgres:18-alpine
    container_name: pass-in-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pass_in}
      POSTGRES_USER: ${POSTGRES_USER:-pass_in}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass_in}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data-v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data-v18:
